name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: tagver-linux-x86_64
            bin_path: target/x86_64-unknown-linux-gnu/release/tagver
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: tagver-linux-arm64
            bin_path: target/aarch64-unknown-linux-gnu/release/tagver
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: tagver-macos-arm64
            bin_path: target/aarch64-apple-darwin/release/tagver
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: tagver-windows-x86_64
            bin_path: target/x86_64-pc-windows-msvc/release/tagver.exe
            archive_ext: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/install-action@cross

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF##*/}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify package versions match the tag
        shell: python
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          import json
          import os
          import subprocess
          import sys

          version = os.environ["VERSION"]
          metadata = json.loads(
              subprocess.check_output(
                  ["cargo", "metadata", "--no-deps", "--locked", "--format-version", "1"]
              )
          )
          mismatched = [
              f"{package['name']} {package['version']}"
              for package in metadata["packages"]
              if package["version"] != version
          ]
          if mismatched:
              sys.exit(f"Package versions differ from tag {version}: {', '.join(mismatched)}")

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (release)
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            cross build --workspace --release --locked --target ${{ matrix.target }}
          else
            cargo build --workspace --release --locked --target ${{ matrix.target }}
          fi

      - name: Test (Linux only)
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --workspace --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          artifact="${{ matrix.artifact_name }}"
          mkdir -p dist/"${artifact}"
          cp "${{ matrix.bin_path }}" dist/"${artifact}"/
          cp LICENSE README.md dist/"${artifact}"/
          tar -C dist -czf "${artifact}.tar.gz" "${artifact}"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifact = "${{ matrix.artifact_name }}"
          New-Item -ItemType Directory -Force -Path "dist/$artifact" | Out-Null
          Copy-Item -Path "${{ matrix.bin_path }}" -Destination "dist/$artifact/"
          Copy-Item -Path "LICENSE","README.md" -Destination "dist/$artifact/"
          Compress-Archive -Path "dist/$artifact/*" -DestinationPath "$artifact.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            *.${{ matrix.archive_ext }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          # Release assets are uploaded by base name, so the manifest lists
          # base names from one flat directory and never lists itself.
          mkdir release
          find artifacts -type f -exec mv --no-clobber -t release {} +
          if [ -n "$(find artifacts -type f)" ]; then
            echo "Duplicate release asset names:" >&2
            find artifacts -type f >&2
            exit 1
          fi
          cd release
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published checksums
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir published
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published
          cd published
          sha256sum --check --strict SHA256SUMS
          diff <(printf '%s\n' * | grep -vx SHA256SUMS | sort) <(cut -d' ' -f3- SHA256SUMS | sort)

  publish:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF##*/}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify package versions match the tag
        shell: python
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          import json
          import os
          import subprocess
          import sys

          version = os.environ["VERSION"]
          metadata = json.loads(
              subprocess.check_output(
                  ["cargo", "metadata", "--no-deps", "--locked", "--format-version", "1"]
              )
          )
          mismatched = [
              f"{package['name']} {package['version']}"
              for package in metadata["packages"]
              if package["version"] != version
          ]
          if mismatched:
              sys.exit(f"Package versions differ from tag {version}: {', '.join(mismatched)}")

      # One multi-package run: cargo packages the library first and resolves the
      # CLI's `tagver` requirement against that package, so the release version
      # does not have to be on crates.io yet.
      - name: Cargo publish dry-run (library and cli)
        run: cargo publish -p tagver -p tagver-cli --locked --allow-dirty --dry-run

      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish library
        run: cargo publish -p tagver --locked --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

      - name: Wait for crate index to update
        run: sleep 20

      - name: Publish cli
        run: cargo publish -p tagver-cli --locked --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  update-major-tag:
    name: Update Major Version Tag
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Update Major Tag
        run: |
          TAG=${GITHUB_REF##*/}
          MAJOR=${TAG%%.*}

          # Don't float a major tag pre-1.0: every 0.x bump may be breaking,
          # so consumers should pin to specific versions until 1.0.0.
          if [[ "$MAJOR" == "0" ]]; then
            echo "Skipping major tag update for pre-1.0 release ($TAG)."
            exit 0
          fi

          echo "Updating $MAJOR to point to $TAG"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -fa "$MAJOR" -m "Update $MAJOR to $TAG"
          git push origin "$MAJOR" --force

  publish-homebrew-tap:
    name: Publish Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF##*/}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout tap repository
        uses: actions/checkout@v7
        with:
          repository: wyrd-company/homebrew-tools
          path: homebrew-tools
          ssh-key: ${{ secrets.FORMULAE_PUBLISH_KEY }}

      - name: Generate formula
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          LINUX_X86_64_ARCHIVE="artifacts/tagver-linux-x86_64/tagver-linux-x86_64.tar.gz"
          LINUX_ARM64_ARCHIVE="artifacts/tagver-linux-arm64/tagver-linux-arm64.tar.gz"
          MACOS_ARM64_ARCHIVE="artifacts/tagver-macos-arm64/tagver-macos-arm64.tar.gz"

          for archive in "$LINUX_X86_64_ARCHIVE" "$LINUX_ARM64_ARCHIVE" "$MACOS_ARM64_ARCHIVE"; do
            if [[ ! -f "$archive" ]]; then
              echo "Missing expected release artifact: $archive" >&2
              exit 1
            fi
          done

          LINUX_X86_64_SHA256="$(sha256sum "$LINUX_X86_64_ARCHIVE" | cut -d' ' -f1)"
          LINUX_ARM64_SHA256="$(sha256sum "$LINUX_ARM64_ARCHIVE" | cut -d' ' -f1)"
          MACOS_ARM64_SHA256="$(sha256sum "$MACOS_ARM64_ARCHIVE" | cut -d' ' -f1)"

          cat > homebrew-tools/Formula/tagver.rb <<EOF
          class Tagver < Formula
            desc "Command-line tool for minimalistic versioning using Git tags"
            homepage "https://github.com/${REPOSITORY}"
            url "https://github.com/${REPOSITORY}/releases/download/${TAG}/tagver-macos-arm64.tar.gz"
            sha256 "${MACOS_ARM64_SHA256}"
            license "Apache-2.0"

            on_macos do
              depends_on arch: :arm
            end

            on_linux do
              on_arm do
                url "https://github.com/${REPOSITORY}/releases/download/${TAG}/tagver-linux-arm64.tar.gz"
                sha256 "${LINUX_ARM64_SHA256}"
              end

              on_intel do
                url "https://github.com/${REPOSITORY}/releases/download/${TAG}/tagver-linux-x86_64.tar.gz"
                sha256 "${LINUX_X86_64_SHA256}"
              end
            end

            def install
              bin.install "tagver"
              prefix.install_metafiles
            end

            test do
              assert_match "Calculate version numbers", shell_output("#{bin}/tagver --help")
            end
          end
          EOF

      - name: Commit and push formula
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd homebrew-tools

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Formula/tagver.rb

          # --cached so a newly-added (previously untracked) formula is
          # detected; plain `git diff` only inspects tracked files.
          if git diff --cached --quiet -- Formula/tagver.rb; then
            echo "Formula already up to date."
            exit 0
          fi

          git commit -m "tagver ${VERSION}"
          git push origin HEAD
