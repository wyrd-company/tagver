$schema: https://intentional.foo/schemas/config.yml
contract: contract-2
settings:
  internal-dependency-bump: patch
discovery:
  managed-paths:
    - detector: cargo-package
      path: crates/cli/Cargo.toml
      release-unit: tagver
    - detector: cargo-package
      path: crates/core/Cargo.toml
      release-unit: tagver
  # The brand asset generator is a private build tool, not a release unit.
  excluded-paths:
    - detector: npm-package
      path: scripts/brand/package.json
      evidence-digest: sha256:585d49a324b951861e72e3bb72cf368ba450dfd869a03b9f5afe13ee6d44bcd9
release-units:
  tagver:
    path: .
    projections:
      - adapter: cargo
        file: crates/core/Cargo.toml
        mode: committed
      - adapter: cargo
        file: crates/cli/Cargo.toml
        mode: committed
      - adapter: toml
        file: crates/cli/Cargo.toml
        pointer: /dependencies/tagver/version
        mode: committed
      - adapter: toml
        file: crates/cli/Cargo.toml
        pointer: /build-dependencies/tagver/version
        mode: committed
      # The wyrd.foo product page shows the installed version.
      - adapter: yaml
        file: /docs/user/docs.yml
        pointer: /products/tagver/version
        mode: committed
    tags:
      primary:
        role: primary
        template: '{version}'
  # The public docs release on their own, so the docs footer can say which
  # docs describe which tagver version. Docs units are tag-only.
  tagver-docs:
    path: docs/user
    depends-on:
      - tagver
    projections:
      - adapter: yaml
        file: /docs/user/docs.yml
        pointer: /products/tagver/docs-version
        mode: committed
    tags:
      primary:
        role: primary
        template: '{id}@{version}'
